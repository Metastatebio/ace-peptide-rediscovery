<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Matched-decoy AUROC in frozen ACE rediscovery analyses</title>
  <desc id="desc">Bar chart of matched-decoy AUROC for v4 broad, v5 broad, v6 broad, v6 balanced, and v6 balanced plus ESM2 fusion. Values are 0.7575, 0.7023, 0.6868, 0.7647, and 0.7817.</desc>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="92" y="44" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18212b">Matched-decoy discrimination in frozen analyses</text>
  <text x="28" y="288" transform="rotate(-90 28 288)" font-family="Arial, sans-serif" font-size="15" fill="#394957">AUROC</text>
  <g stroke="#dbe3ea" stroke-width="1" font-family="Arial, sans-serif" font-size="13" fill="#526170">
    <line x1="92" y1="450" x2="1050" y2="450"/><text x="78" y="455" text-anchor="end">0.00</text>
    <line x1="92" y1="382" x2="1050" y2="382"/><text x="78" y="387" text-anchor="end">0.20</text>
    <line x1="92" y1="314" x2="1050" y2="314"/><text x="78" y="319" text-anchor="end">0.40</text>
    <line x1="92" y1="246" x2="1050" y2="246"/><text x="78" y="251" text-anchor="end">0.60</text>
    <line x1="92" y1="178" x2="1050" y2="178"/><text x="78" y="183" text-anchor="end">0.80</text>
    <line x1="92" y1="110" x2="1050" y2="110"/><text x="78" y="115" text-anchor="end">1.00</text>
  </g>
  <g fill="#475569">
    <rect x="132" y="192.5" width="128" height="257.5" rx="2"/><rect x="322" y="211.2" width="128" height="238.8" rx="2"/>
    <rect x="512" y="216.5" width="128" height="233.5" rx="2"/><rect x="702" y="190.0" width="128" height="260.0" rx="2"/>
  </g>
  <rect x="892" y="184.2" width="128" height="265.8" rx="2" fill="#2563eb"/>
  <g font-family="Arial, sans-serif" fill="#18212b" text-anchor="middle">
    <text x="196" y="180" font-size="14" font-weight="700">0.7575</text><text x="386" y="199" font-size="14" font-weight="700">0.7023</text>
    <text x="576" y="204" font-size="14" font-weight="700">0.6868</text><text x="766" y="178" font-size="14" font-weight="700">0.7647</text>
    <text x="956" y="172" font-size="14" font-weight="700">0.7817</text>
    <text x="196" y="482" font-size="14">v4 broad</text><text x="386" y="482" font-size="14">v5 broad</text>
    <text x="576" y="482" font-size="14">v6 broad</text><text x="766" y="482" font-size="14">v6 balanced</text>
    <text x="956" y="482" font-size="14">v6 + ESM2</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#526170"><rect x="92" y="516" width="14" height="14" fill="#475569"/><text x="113" y="528">Frozen recipe</text><rect x="240" y="516" width="14" height="14" fill="#2563eb"/><text x="261" y="528">Frozen ESM2 fusion</text></g>
</svg>
